<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Firebase User Management Console</title>
</head>
<body>

  <h1>Firebase Realtime Database</h1>

  <h2>Create / Write User</h2>

  <input type="text" id="first_name" placeholder="First Name"><br><br>
  <input type="text" id="last_name" placeholder="Last Name"><br><br>
  <input type="email" id="email" placeholder="Email"><br><br>
  <input type="text" id="phone" placeholder="Phone Number"><br><br>
  <input type="text" id="address" placeholder="Address"><br><br>
  <input type="number" id="age" placeholder="Age"><br><br>
  <input type="text" id="gender" placeholder="Gender"><br><br>
  <input type="text" id="hobby" placeholder="Hobby"><br><br>
  <input type="text" id="major" placeholder="Major"><br><br>
  <input type="text" id="college" placeholder="College"><br><br>

  <button onclick="writeUser()">Write User</button>

  <script type="module" src="script.js"></script>

</body>
</html>
