<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="animation.css">
  <title>Box Animation</title>
</head>
<body>
  <p class="paragraph"> If you click the animate button the box will increase it's size</p>
  <button onclick="animateBox()">Animate</button>
  <div class="box"></div>

  <script>
    function animateBox() {
      const box = document.querySelector('.box');
      box.classList.add('grow');
    }
  </script>
</body>
</html>
