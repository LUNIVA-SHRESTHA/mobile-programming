<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="shuffle.css">
</head>
<body>
    <button onclick="shuffle()" class="shuffle">Shuffle</button>
    <div class="boxes">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
    </div>

    <script>
        function shuffle() {
            const colors = ['orange', 'blue', 'red', 'green'];
            const boxes = document.querySelectorAll('.box');
            const shuffled = [...colors].sort(() => Math.random() - 0.5);
            boxes.forEach((box, i) => box.style.backgroundColor = shuffled[i]);
        }
    </script>
</body>
</html>
