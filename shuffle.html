<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="shuffle.css">
</head>
<body>
    <p class="heading"> Click the box to shuffle</p>
    <button onclick="shuffle()" class="shuffle">Shuffle</button>

    <div class="boxes">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        function shuffle() {
            const colors = ['orange', 'blue', 'red', 'green'];
            const shuffled = [...colors].sort(() => Math.random() - 0.5);
            $('.box').each(function(i) {
                $(this).css('backgroundColor', shuffled[i]);
            });
        }
    </script>
</body>
</html>
