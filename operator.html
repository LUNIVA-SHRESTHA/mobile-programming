<head>
<link rel="stylesheet" href="operator.css">
<title>Operators in JavaScript</title>
</head>
<body>

    <div class="container">

        <h1>Add Two Numbers</h1>
        <div class="input-group">
            <input type="number" id="num1" placeholder="Enter first number" />
            <input type="number" id="num2" placeholder="Enter second number" />
            <button onclick="addNumbers()">Add</button>
        </div>

        <div class="result" id="result">
            <h2>Result:</h2>
            <p id="resultValue"></p>
        </div>

        <h1> Subtract Two Numbers </h1>
        <div class="input-group">
            <input type="number" id="num3" placeholder="Enter first number" />
            <input type="number" id="num4" placeholder="Enter second number" />
            <button onclick="subtractNumbers()">Subtract</button>
        </div>

        <div class="result" id="result2">
            <h2>Result:</h2>
            <p id="resultValue1"></p>
        </div>

        <h1>Multiply Two Numbers</h1>
        <div class="input-group">
            <input type="number" id="num5" placeholder="Enter first number" />
            <input type="number" id="num6" placeholder="Enter second number"/>
            <button onclick="multiplyNumbers()">Multiply</button>
        </div>

        <div class="result" id="result3">
            <h2>Result:</h2>
            <p id="resultValue2"></p>
        </div>

        <h1>Division Two Numbers</h1>
        <div class="input-group">
            <input type="number" id="num7" placeholder="Enter first Number"/>
            <input type="number" id="num8" placeholder="Enter second Number"/>
            <button onclick="divisionNumbers()">Division</button>
        </div>

        <div class="result" id="result4">
            <h2>Result:</h2>
            <p id="resultValue3"> </p>
        </div>

    </div>
<script src="operator.js"></script>
   


</body>
